# Alert Rules for joash-web-app

groups:
  - name: joash-web-app-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }}%"

      - alert: ServiceDown
        expr: up{job="joash-web-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "joash-web-app is down"
